<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<title>Ukázky práce | RC mulčování Mikeska</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="main.css">

<style>

.gallery{
max-width:1100px;
margin:auto;
padding:120px 20px 60px 20px;
text-align:center;
}

.gallery h1{
font-size:40px;
margin-bottom:10px;
}

.gallery h1 span{
color:#6bcf4a;
}

.gallery p{
color:#aaa;
margin-bottom:60px;
}

/* tlačítko domů mobil */

.mobile-home{
display:none;
text-align:center;
margin-top:90px;
}

.mobile-home a{
background:#6bcf4a;
color:black;
padding:12px 25px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

/* BLOK REALIZACE */

.realizace{
margin-bottom:60px;
}

.foto-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.foto-box{
background:#1e1e1e;
padding:10px;
border-radius:10px;
}

.foto-box img{
width:100%;
border-radius:8px;
display:block;
}

.foto-label{
margin-bottom:8px;
font-size:14px;
color:#6bcf4a;
font-weight:bold;
}

/* MOBIL */

@media (max-width:768px){

.foto-grid{
grid-template-columns:1fr;
}

.mobile-home{
display:block;
}

}

</style>
</head>

<body>

<header class="topbar">
<div class="topbar-inner">

<img src="logo.png" class="logo" alt="Mikeska">

<nav>
<a href="index.html">Domů</a>
</nav>

</div>
</header>

<div class="mobile-home">
<a href="index.html">← Domů</a>
</div>

<p>Před a po mulčování svahů a neudržovaných ploch.</p>

</div>

<div class="foto-box">

</div>

</div>

</div>


<div class="realizace">

</div>

</div>


</section>

</body>
</html>
