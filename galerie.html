<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<title>Ukázky práce | RC mulčování Mikeska</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="main.css">

<style>

body{
background:#0f1a14;
color:white;
font-family:Arial;
margin:0;
}

/* NADPIS */

.gallery{
max-width:1100px;
margin:auto;
padding:120px 20px 80px 20px;
}

.gallery h1{
text-align:center;
font-size:40px;
margin-bottom:10px;
}

.gallery h1 span{
color:#2ecc71;
}

.gallery p{
text-align:center;
margin-bottom:30px;
color:#ccc;
}

/* TLAČÍTKO ZPĚT */

.back-home{
text-align:center;
margin-bottom:60px;
}

.back-home a{
background:#2ecc71;
color:#0f1a14;
padding:12px 25px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
display:inline-block;
}

/* SLIDER */

.ba-container{
position:relative;
overflow:hidden;
border-radius:20px;
margin-bottom:60px;
box-shadow:0 10px 30px rgba(0,0,0,0.5);
border:1px solid #1f3b2c;
}

.ba-container img{
width:100%;
display:block;
}

.ba-after{
position:absolute;
top:0;
left:0;
width:50%;
overflow:hidden;
}

.ba-slider{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
opacity:0;
cursor:ew-resize;
}

/* čára mezi obrázky */

.ba-container::after{
content:"";
position:absolute;
top:0;
bottom:0;
left:50%;
width:3px;
background:white;
pointer-events:none;
}

/* PŘED / PO */

.ba-label{
position:absolute;
top:15px;
padding:6px 12px;
background:rgba(0,0,0,0.6);
border-radius:6px;
font-size:13px;
}

.ba-label.before{
left:15px;
}

.ba-label.after{
right:15px;
}

</style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <img src="logo.png" class="logo" alt="Mikeska">

    <nav>
      <a href="index.html">Domů</a>
      <a href="galerie.html">Ukázky práce</a>
      <a href="index.html#kontakt">Kontakt</a>
    </nav>
  </div>
</header>

<section class="gallery">

<h1><span>Ukázky</span> naší práce</h1>
<p>Před a po mulčování svahů a neudržovaných ploch.</p>

<div class="back-home">
<a href="index.html">← Zpět na hlavní stránku</a>
</div>

<div class="ba-container">

<div class="ba-label before">PŘED</div>
<div class="ba-label after">PO</div>

<img src="po1.jpg">

<div class="ba-after">
<img src="pred1.jpg">
</div>

<input type="range" min="0" max="100" value="50" class="ba-slider">

</div>

<div class="ba-container">

<div class="ba-label before">PŘED</div>
<div class="ba-label after">PO</div>

<img src="po2.jpg">

<div class="ba-after">
<img src="pred2.jpg">
</div>

<input type="range" min="0" max="100" value="50" class="ba-slider">

</div>

<div class="ba-container">

<div class="ba-label before">PŘED</div>
<div class="ba-label after">PO</div>

<img src="po3.jpg">

<div class="ba-after">
<img src="pred3.jpg">
</div>

<input type="range" min="0" max="100" value="50" class="ba-slider">

</div>

</section>

<script>

document.querySelectorAll(".ba-container").forEach(container => {

const slider = container.querySelector(".ba-slider");
const after = container.querySelector(".ba-after");

slider.addEventListener("input", function(){
after.style.width = this.value + "%";
});

});

</script>

</body>
</html>
