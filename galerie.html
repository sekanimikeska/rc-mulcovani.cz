<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Ukázky práce | RC mulčování Mikeska</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="main.css">

<style>

body{
background:#0f0f0f;
color:#eaeaea;
margin:0;
font-family:"Segoe UI", Arial, sans-serif;
}

.gallery{
max-width:1100px;
margin:auto;
padding:120px 20px 60px 20px;
text-align:center;
}

.gallery h1{
font-size:40px;
margin-bottom:10px;
}

.gallery h1 span{
color:#6bcf4a;
}

.gallery p{
color:#aaa;
margin-bottom:60px;
}

/* logo */

.gallery-logo{
margin-bottom:30px;
}

.gallery-logo img{
height:60px;
}

/* tlačítko domů */

.home-btn{
display:inline-block;
margin-bottom:40px;
background:#6bcf4a;
color:#000;
padding:10px 20px;
border-radius:6px;
text-decoration:none;
font-weight:bold;
}

/* slider */

.ba-container{
position:relative;
overflow:hidden;
border-radius:14px;
margin-bottom:60px;
box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.ba-container img{
width:100%;
display:block;
}

.ba-after{
position:absolute;
top:0;
left:0;
width:50%;
overflow:hidden;
}

.ba-slider{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
opacity:0;
cursor:ew-resize;
}

/* čára */

.ba-container::after{
content:"";
position:absolute;
top:0;
bottom:0;
left:50%;
width:3px;
background:white;
}

</style>
</head>

<body>

<section class="gallery">

<div class="gallery-logo">
<img src="logo.png" alt="Mikeska">
</div>

<a href="index.html" class="home-btn">← Domů</a>

<h1><span>Ukázky</span> naší práce</h1>
<p>Před a po mulčování svahů a neudržovaných ploch.</p>

<!-- 1 -->

<div class="ba-container">
<img src="po1.jpg">

<div class="ba-after">
<img src="před1.jpg">
</div>

<input type="range" min="0" max="100" value="50" class="ba-slider">
</div>

<!-- 2 -->

<div class="ba-container">
<img src="po2.jpg">

<div class="ba-after">
<img src="před2.jpg">
</div>

<input type="range" min="0" max="100" value="50" class="ba-slider">
</div>

<!-- 3 -->

<div class="ba-container">
<img src="po3.jpg">

<div class="ba-after">
<img src="před3.jpg">
</div>

<input type="range" min="0" max="100" value="50" class="ba-slider">
</div>

</section>

<script>

document.querySelectorAll(".ba-container").forEach(container => {

const slider = container.querySelector(".ba-slider");
const after = container.querySelector(".ba-after");

slider.addEventListener("input", function(){
after.style.width = this.value + "%";
});

});

</script>

</body>
</html>
