<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<title>Ukázky práce | RC mulčování Mikeska</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="main.css">

<style>

*{box-sizing:border-box;margin:0;padding:0}

body{
background:#0f1a14;
color:white;
font-family:Arial;
}

/* HEADER STEJNÝ JAKO POPTVÁVKA */

header{
background:#0b120e;
padding:15px 30px;
display:flex;
justify-content:flex-end;
align-items:center;
border-bottom:1px solid #1f3b2c;
}

nav a{
font-weight:600;
text-decoration:none;
color:white;
}

nav a:hover{
color:#2ecc71;
}

/* GALERIE */

.gallery{
max-width:1100px;
margin:60px auto;
padding:20px;
}

.gallery h1{
text-align:center;
font-size:40px;
margin-bottom:10px;
}

.gallery h1 span{
color:#2ecc71;
}

.gallery p{
text-align:center;
margin-bottom:60px;
color:#ccc;
}

/* SLIDER */

.ba-container{
position:relative;
overflow:hidden;
border-radius:20px;
margin-bottom:60px;
box-shadow:0 10px 30px rgba(0,0,0,0.5);
border:1px solid #1f3b2c;
}

.ba-container img{
width:100%;
display:block;
}

.ba-after{
position:absolute;
top:0;
left:0;
width:50%;
overflow:hidden;
}

.ba-slider{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
opacity:0;
cursor:ew-resize;
}

.ba-container::after{
content:"";
position:absolute;
top:0;
bottom:0;
left:50%;
width:3px;
background:white;
pointer-events:none;
}

/* PŘED / PO */

.ba-label{
position:absolute;
top:15px;
padding:6px 12px;
background:rgba(0,0,0,0.6);
border-radius:6px;
font-size:13px;
}

.ba-label.before{
left:15px;
}

.ba-label.after{
right:15px;
}

</style>
</head>

<body>

<header>
<nav>
<a href="/index.html">Domů</a>
</nav>
</header>

<section class="gallery">

<h1><span>Ukázky</span> naší práce</h1>
<p>Před a po mulčování svahů a neudržovaných ploch.</p>

<div class="ba-container">

<div class="ba-label before">PŘED</div>
<div class="ba-label after">PO</div>

<img src="po1.jpg">

<div class="ba-after">
<img src="pred1.jpg">
</div>

<input type="range" min="0" max="100" value="50" class="ba-slider">

</div>

<div class="ba-container">

<div class="ba-label before">PŘED</div>
<div class="ba-label after">PO</div>

<img src="po2.jpg">

<div class="ba-after">
<img src="pred2.jpg">
</div>

<input type="range" min="0" max="100" value="50" class="ba-slider">

</div>

<div class="ba-container">

<div class="ba-label before">PŘED</div>
<div class="ba-label after">PO</div>

<img src="po3.jpg">

<div class="ba-after">
<img src="pred3.jpg">
</div>

<input type="range" min="0" max="100" value="50" class="ba-slider">

</div>

</section>

<script>

document.querySelectorAll(".ba-container").forEach(container => {

const slider = container.querySelector(".ba-slider");
const after = container.querySelector(".ba-after");

slider.addEventListener("input", function(){
after.style.width = this.value + "%";
});

});

</script>

</body>
</html>
